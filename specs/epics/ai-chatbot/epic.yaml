# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (AC → AC-1, AC-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: ai-chatbot
  key: AC
spec:
  title: "Vercel's Next.js AI Chatbot on Cloudflare Workers with Supabase Postgres, Hyperdrive and R2"
  summary: "The vercel/ai-chatbot template — AI SDK 7 streaming chat with artifacts and tools, next-auth v5 with a guest flow, Drizzle over Postgres, image attachments — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare. Its Postgres is a Supabase project reached through Hyperdrive (the Lumen baseline's shape: supabase and cloudflare-hyperdrive Terraform roots, the schema applied by db-migrate from packages/db), its attachments go to an R2 bucket the Worker serves back, and its model calls keep the Vercel AI Gateway (until AC5, which makes Workers AI the default and the gateway optional). Everything Vercel-only in the code — Blob, BotID, @vercel/functions, @vercel/otel, @vercel/analytics — is replaced by the Cloudflare equivalent or a no-op, each recorded as a departure; the chat, auth, artifact and data code is the template's."
  state: started
  milestones:
    - name: "AC0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [AC-1]
    - name: "AC1 — the chatbot on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built by `next build` + `opennextjs-cloudflare build`, with the Postgres client built per call from the HYPERDRIVE binding and attachments on the BLOB R2 binding"
        - "the wrangler config renders per environment from the hyperdrive and r2 roots' wiring documents (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint` (the template's own biome/ultracite), `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` boots the Worker: /ping answers pong, static assets serve, the auth and API routes answer with their own errors when no database is reachable"
      tasks: [AC-2]
    - name: "AC2 — the schema through db-migrate"
      exitCriteria:
        - "packages/db (@saas/db) carries the template's schema verbatim as a manifest-listed migration; tests/db verifies the checksums and the offline plan"
        - "infra/db-migrate applies it to each environment's Supabase project after the project exists"
      tasks: [AC-3]
    - name: "AC3 — Supabase, Hyperdrive and R2 from Terraform"
      exitCriteria:
        - "infra/terraform/{supabase,cloudflare-hyperdrive,cloudflare-r2} validate and publish the secrets and wiring documents the app and db-migrate components name"
      tasks: [AC-4]
    - name: "AC4 — ready to instantiate"
      exitCriteria:
        - "the README says how to run it locally with a Postgres, test, preview and deploy it through Orun, which Worker secrets to set and how attachments and the model gateway are configured"
        - "the as-built status records every departure from the upstream template"
      tasks: [AC-5]
    - name: "AC5 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card, requires [github, cloudflare, supabase], six brokered keys — an r2-data key for the R2 root among them) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing, then record it (01-product, 02-docs)"
        - "the product's own push-to-main plan converges supabase → cloudflare-hyperdrive → db-migrate → web and cloudflare-r2 → web per environment, every edge enforced on main and advisory on a pull request"
        - "Workers AI through an AI binding is the default model provider for the chat, the titles and the artifact tools; the AI Gateway's models are offered only with its key; a fresh product chats with no model key"
        - "a fresh product signs a guest in and registers a user with no AUTH_SECRET: the session key is one the database generated, kept in a schema the Data API does not expose"
        - "every table in public has row-level security and no policy: Supabase's Data API (anon, authenticated) reads and writes nothing, the app, as the tables' owner, everything"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the product's plans, and the end-to-end tier (a stand-in AI binding — Workers AI is not called offline)"
      tasks: [AC-6]
    - name: "AC6 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
        - "the console card reads subdomain from the Cloudflare connection (from: connection.cloudflare.workersSubdomain), as cirrus-baseline since baseline-v23"
      tasks: [AC-7, AC-8]
